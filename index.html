<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ตารางจาก JSON</title>

<style>

body{
font-family:sans-serif;
}

table{
border-collapse: collapse;
width:90%;
margin:auto;
}

th,td{
border:1px solid #333;
padding:8px;
text-align:center;
}

th{
background:#ddd;
}

tr:nth-child(even){
background:#f2f2f2;
}

</style>
</head>

<body>

<h2 style="text-align:center">ตารางข้อมูล</h2>

<table id="table">
<thead></thead>
<tbody></tbody>
</table>

<script>

fetch("data.json")
.then(res => res.json())
.then(data => {

let sheet = Object.keys(data)[0]
let rows = data[sheet]

let thead = document.querySelector("#table thead")
let tbody = document.querySelector("#table tbody")

// header
let head = document.createElement("tr")

;["วันที่","วันเวลา","บทอ่านที่1","บทอ่านที่2"].forEach(t=>{
let th = document.createElement("th")
th.textContent = t
head.appendChild(th)
})

thead.appendChild(head)


// body
rows.forEach(row=>{

let tr = document.createElement("tr")

// date
let td1 = document.createElement("td")
td1.textContent = thaiDate(row.date)
tr.appendChild(td1)

// time
let td2 = document.createElement("td")
td2.textContent = row.time
tr.appendChild(td2)


// reader1
if(row.rowspan !== 0){

let td3 = document.createElement("td")

if(row.rowspan>1){
td3.setAttribute("rowspan",row.rowspan)
}

td3.innerHTML = row.reader1.replace(/\n/g,"<br>")
tr.appendChild(td3)

}


// reader2
if(row.rowspan !== 0){

let td4 = document.createElement("td")

if(row.rowspan>1){
td4.setAttribute("rowspan",row.rowspan)
}

td4.innerHTML = row.reader2.replace(/\n/g,"<br>")
tr.appendChild(td4)

}

tbody.appendChild(tr)

})

})

</script>

<script>

function thaiDate(dateStr){

if(!dateStr || dateStr.trim()===""){
return ""
}

let d = new Date(dateStr)

if(isNaN(d)){
return dateStr
}

let months = [
"ม.ค.","ก.พ.","มี.ค.","เม.ย.",
"พ.ค.","มิ.ย.","ก.ค.","ส.ค.",
"ก.ย.","ต.ค.","พ.ย.","ธ.ค."
]

let day = d.getDate()
let month = months[d.getMonth()]
let year = d.getFullYear() + 543

return day + " " + month + " " + year
}

</script>

</body>
</html>
