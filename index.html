<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ตารางผู้อ่านบทอ่าน</title>

<style>

body{
font-family:sans-serif;
}

h2{
margin-left:5%;
}

table{
border-collapse:collapse;
width:90%;
margin:auto;
}

th,td{
border:1px solid #444;
padding:8px;
text-align:center;
}

th{
background:#f2f2f2;
}

</style>
</head>

<body>

<h2>ตารางผู้อ่านบทอ่าน</h2>

<table id="table">
<thead>
<tr>
<th>วันที่</th>
<th>วัน/เวลา</th>
<th>บทอ่านที่ 1</th>
<th>บทอ่านที่ 2</th>
<th>บทมวลชน</th>
</tr>
</thead>
<tbody>
</tbody>
</table>

<script>

function formatDate(dateStr){

if(!dateStr.includes("-")) return dateStr

let d = new Date(dateStr)

let day = d.getDate()

let month = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."]

let year = d.getFullYear()

return day+" "+month[d.getMonth()]+" "+year

}

fetch("data.json")
.then(res=>res.json())
.then(data=>{

let rows = data.Sheet1
let tbody = document.querySelector("#table tbody")

let lastDate=""
let dateCount=0

for(let i=0;i<rows.length;i++){

let r = rows[i]

if(r["วันที่"]==lastDate){

dateCount++

}else{

dateCount=1

for(let j=i+1;j<rows.length;j++){
if(rows[j]["วันที่"]==r["วันที่"]) dateCount++
else break
}

}

let tr=document.createElement("tr")

if(r["วันที่"]!=lastDate){

let td=document.createElement("td")
td.rowSpan=dateCount
td.textContent=formatDate(r["วันที่"])
tr.appendChild(td)

}

lastDate=r["วันที่"]

let tdTime=document.createElement("td")
tdTime.textContent=r["วัน/เวลา"] || ""
tr.appendChild(tdTime)

if(!r["บทอ่านที่ 2"]){

let td=document.createElement("td")
td.colSpan=2
td.textContent=r["บทอ่านที่ 1"] || ""
tr.appendChild(td)

}else{

let td1=document.createElement("td")
td1.textContent=r["บทอ่านที่ 1"] || ""
tr.appendChild(td1)

let td2=document.createElement("td")
td2.textContent=r["บทอ่านที่ 2"] || ""
tr.appendChild(td2)

}

let tdMass=document.createElement("td")
tdMass.textContent=r["บทมวลชน"] || ""
tr.appendChild(tdMass)

tbody.appendChild(tr)

}

})

</script>

</body>
</html>
