<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ตารางจาก CSV</title>

<style>
body{
font-family:sans-serif;
}

table{
border-collapse: collapse;
width:90%;
margin:auto;
}

th,td{
border:1px solid #333;
padding:8px;
text-align:center;
}

th{
background:#ddd;
}

tr:nth-child(even){
background:#f2f2f2;
}
</style>

</head>

<body>

<h2 style="text-align:center">ตารางข้อมูล</h2>

<table id="table">
<thead></thead>
<tbody></tbody>
</table>

<script>

fetch("b.csv")
.then(res => res.text())
.then(data => {

let rows = data.trim().split("\n")

let tableHead = document.querySelector("#table thead")
let tableBody = document.querySelector("#table tbody")

rows.forEach((row,index)=>{

let cols = row.split(",")

let tr = document.createElement("tr")

cols.forEach(col=>{

let cell

if(index===0){
cell = document.createElement("th")
}else{
cell = document.createElement("td")
}

cell.textContent = col.trim()
tr.appendChild(cell)

})

if(index===0){
tableHead.appendChild(tr)
}else{
tableBody.appendChild(tr)
}

})

})

</script>

</body>
</html>
