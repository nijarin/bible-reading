<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ตารางจาก JSON</title>

<style>

body{
font-family:sans-serif;
}

table{
border-collapse: collapse;
width:90%;
margin:auto;
}

th,td{
border:1px solid #333;
padding:8px;
text-align:center;
}

th{
background:#ddd;
}

tr:nth-child(even){
background:#f2f2f2;
}

</style>
</head>

<body>

<h2 style="text-align:center">ตารางข้อมูล</h2>

<table id="table">
<thead></thead>
<tbody></tbody>
</table>

<script>

fetch("data.json")
.then(res => res.json())
.then(data => {

let sheet = Object.keys(data)[0]   // ใช้ sheet แรก
let rows = data[sheet]

let tableHead = document.querySelector("#table thead")
let tableBody = document.querySelector("#table tbody")

// header
let headerRow = document.createElement("tr")

Object.keys(rows[0]).forEach(col => {

let th = document.createElement("th")
th.textContent = col
headerRow.appendChild(th)

})

tableHead.appendChild(headerRow)


// body
rows.forEach(row => {

let tr = document.createElement("tr")

Object.values(row).forEach((value,index) => {

let td = document.createElement("td")

if(index === 0){
td.textContent = thaiDate(value)
}else{
td.textContent = value
}

tr.appendChild(td)

})

tableBody.appendChild(tr)

})

})

</script>


<script>

function thaiDate(dateStr){

if(!dateStr || dateStr.trim()===""){
return ""
}

let d = new Date(dateStr)

if(isNaN(d)){
return dateStr
}

let months = [
"ม.ค.","ก.พ.","มี.ค.","เม.ย.",
"พ.ค.","มิ.ย.","ก.ค.","ส.ค.",
"ก.ย.","ต.ค.","พ.ย.","ธ.ค."
]

let day = d.getDate()
let month = months[d.getMonth()]
let year = d.getFullYear() + 543

return day + " " + month + " " + year
}

</script>

</body>
</html>
