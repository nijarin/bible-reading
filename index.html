<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ตารางผู้อ่านบทอ่าน</title>

<style>
body{
font-family:sans-serif;
padding:20px;
}

table{
border-collapse:collapse;
width:100%;
}

th,td{
border:1px solid #444;
padding:6px;
text-align:center;
vertical-align:middle;
}

th{
background:#f2f2f2;
}

</style>
</head>

<body>

<h2>ตารางผู้อ่านบทอ่าน</h2>

<table id="table">
<thead>
<tr>
<th>วันที่</th>
<th>วัน/เวลา</th>
<th>บทอ่านที่ 1</th>
<th>บทอ่านที่ 2</th>
<th>บทมวลชน</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

function thaiDate(dateStr){

if(!dateStr || isNaN(Date.parse(dateStr))) return dateStr

let d=new Date(dateStr)

let days=["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."]

let months=[
"ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.",
"ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."
]

let day=days[d.getDay()]
let date=d.getDate()
let month=months[d.getMonth()]
let year=d.getFullYear()+543

return `${day} ${date} ${month} ${year}`

}

fetch("data.json")
.then(res=>res.json())
.then(data=>{

let rows=data.Sheet1

let tbody=document.querySelector("#table tbody")

rows.forEach(row=>{

let tr=document.createElement("tr")

/* วันที่ */

let tdDate=document.createElement("td")

if(row.rowspan!=0){

if(row.rowspan>1){
tdDate.setAttribute("rowspan",row.rowspan)
}

tdDate.textContent=thaiDate(row["วันที่"])

tr.appendChild(tdDate)

}

/* เวลา */

let tdTime=document.createElement("td")

if(row.rowspan>0){

if(row.rowspan>1){
tdTime.setAttribute("rowspan",row.rowspan)
}

tdTime.textContent=row["วัน/เวลา"]||""

tr.appendChild(tdTime)

}

/* บทอ่านที่ 1 */

let td1=document.createElement("td")

td1.innerHTML=(row["บทอ่านที่ 1"]||"").replace(/\n/g,"<br>")

tr.appendChild(td1)

/* บทอ่านที่ 2 */

let td2=document.createElement("td")

td2.innerHTML=(row["บทอ่านที่ 2"]||"").replace(/\n/g,"<br>")

tr.appendChild(td2)

/* บทมวลชน */

let td3=document.createElement("td")

td3.innerHTML=(row["บทมวลชน"]||"").replace(/\n/g,"<br>")

tr.appendChild(td3)

tbody.appendChild(tr)

})

})

</script>

</body>
</html>
