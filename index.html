<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ตารางผู้อ่านบทอ่าน</title>

<style>

body{
font-family:sans-serif;
}

h2{
margin-left:5%;
}

#filter{
margin-left:5%;
margin-bottom:10px;
font-size:16px;
padding:4px;
}

table{
border-collapse:collapse;
width:90%;
margin:auto;
}

th,td{
border:1px solid #444;
padding:8px;
text-align:center;
vertical-align:top;
}

th{
background:#f0ea4f;
}

tbody tr:nth-child(odd){
background:#ffffff;
}

tbody tr:nth-child(even){
background:#e6f2ff;
}

</style>

</head>

<body>

<h2>ตารางเวรผู้อ่านพระคัมภีร์และบทภาวนาเพื่อมวลชน</h2>

<select id="filter"></select>

<table id="table">
<thead>
<tr>
<th>วันที่</th>
<th>วัน/เวลา</th>
<th>บทอ่านที่ 1</th>
<th>บทอ่านที่ 2</th>
<th>บทมวลชน</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

const monthNames=[
"มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
"กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"
]

let allRows=[]


function formatDate(dateStr){

if(!dateStr || !dateStr.includes("-")) return dateStr

let d=new Date(dateStr)

if(isNaN(d)) return dateStr

let day=d.getDate()

let month=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."]

let year=d.getFullYear()

return day+" "+month[d.getMonth()]+" "+year

}


function renderValue(value,isDate=false){

if(!value) return ""

if(Array.isArray(value)){

return value.map((v,i)=>{

if(isDate && i==0) return formatDate(v)

return v

}).join("<br>")

}

if(isDate) return formatDate(value)

return value

}


function getYearMonth(dateValue){

let d = Array.isArray(dateValue) ? dateValue[0] : dateValue

if(!d || !d.includes("-")) return null

let dt=new Date(d)

if(isNaN(dt)) return null

return dt.getFullYear()+"-"+(dt.getMonth()+1)

}


function renderTable(rows){

let tbody=document.querySelector("#table tbody")

tbody.innerHTML=""

let lastDate=""
let dateCount=0

for(let i=0;i<rows.length;i++){

let r=rows[i]

let dateValue=r["วันที่"]

if(dateValue==lastDate){

dateCount++

}else{

dateCount=1

for(let j=i+1;j<rows.length;j++){
if(rows[j]["วันที่"]==dateValue) dateCount++
else break
}

}

let tr=document.createElement("tr")

if(dateValue!=lastDate){

let td=document.createElement("td")

td.rowSpan=dateCount

td.innerHTML=renderValue(dateValue,true)

tr.appendChild(td)

}

lastDate=dateValue


let tdTime=document.createElement("td")

tdTime.innerHTML=renderValue(r["วัน/เวลา"])

tr.appendChild(tdTime)


if(!r["บทอ่านที่ 2"]){

let td=document.createElement("td")

td.colSpan=2

td.innerHTML=renderValue(r["บทอ่านที่ 1"])

tr.appendChild(td)

}else{

let td1=document.createElement("td")

td1.innerHTML=renderValue(r["บทอ่านที่ 1"])

tr.appendChild(td1)

let td2=document.createElement("td")

td2.innerHTML=renderValue(r["บทอ่านที่ 2"])

tr.appendChild(td2)

}


let tdMass=document.createElement("td")

tdMass.innerHTML=renderValue(r["บทมวลชน"])

tr.appendChild(tdMass)

tbody.appendChild(tr)

}

}


function buildFilter(){

let select=document.getElementById("filter")

select.innerHTML=""

/* ตัวเลือกทั้งหมด */

let allOption=document.createElement("option")
allOption.value="all"
allOption.text="ทั้งหมด"
select.appendChild(allOption)


let months=new Set()

allRows.forEach(r=>{

let ym=getYearMonth(r["วันที่"])

if(ym) months.add(ym)

})

let sorted=[...months].sort()

sorted.forEach(m=>{

let [y,mo]=m.split("-")

let opt=document.createElement("option")

opt.value=m

opt.text=monthNames[mo-1]+" "+y

select.appendChild(opt)

})


select.onchange=()=>{

let val=select.value

if(val==="all"){

renderTable(allRows)
return

}

let filtered=allRows.filter(r=>{

let ym=getYearMonth(r["วันที่"])

return ym==val

})

renderTable(filtered)

}

/* ค่าเริ่มต้น */

select.value="all"
renderTable(allRows)

}


fetch("data.json")

.then(r=>r.json())

.then(data=>{

allRows=data.Sheet1

buildFilter()

})

</script>

</body>
</html>
